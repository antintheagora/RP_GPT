[project]
name = "rp-gpt"
version = "0.2.0"
description = "A local-LLM roleplaying game with an AI dungeon master."
readme = "README.md"
requires-python = ">=3.11,<3.15"

# Derived by parsing every import in the tree and subtracting the standard
# library, not by hand. requirements-web.txt listed only flask and pywebview,
# so a fresh clone failed on first run.
dependencies = [
    "flask>=3.0",       # ui/webapp/server.py
    "werkzeug>=3.0",    # desktop/run_webview.py imports it directly
    "pywebview>=4.4",   # desktop/run_webview.py, imported as `webview`
    "certifi>=2024.0",  # Core/Image_Gen.py, stricter TLS on image fetches
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
rp-gpt = "desktop.run_webview:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["engine", "Core", "ui", "ui.webapp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests must never reach for a GPU, an Ollama host, or the network. The
# environment is set in tests/conftest.py rather than here, so no plugin is
# required to run the suite.
filterwarnings = ["error::SyntaxWarning"]
