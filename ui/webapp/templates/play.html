{% extends "base.html" %}
{% block content %}
  {# The turn as it is written. Lives outside both htmx targets so a swap
     cannot wipe it mid-sentence, and empties itself when the settled render
     arrives -- see chronicle.js. #}
  <div id="chronicle" class="chronicle-feed" aria-live="polite"></div>

  <div class="play-grid">
    <div id="turn-panel" class="play-panel" hx-get="{{ url_for('turn_panel') }}" hx-trigger="load, refresh-turn from:body" hx-target="this"></div>
    <div id="log-panel" class="play-panel" hx-get="{{ url_for('log_panel') }}" hx-trigger="load, refresh-turn from:body" hx-target="this"></div>
  </div>
{% endblock %}
